<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PhoneVerdict</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom Theme CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Header -->
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="text-center mb-3">
                <i class="bi bi-phone-flip text-primary fs-1"></i>
            </div>
            <h2>Welcome Back</h2>
            <p class="auth-subtitle">Log in to review smartphones and access your dashboard</p>

            <!-- Alerts -->
            <div class="alert alert-danger py-2 small mb-3" th:if="${loginError}">
                <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${loginError}">Invalid credentials</span>
            </div>
            <div class="alert alert-info py-2 small mb-3" th:if="${logoutMessage}">
                <i class="bi bi-info-circle-fill me-1"></i> <span th:text="${logoutMessage}">Logged out</span>
            </div>
            <div class="alert alert-success py-2 small mb-3" th:if="${successMessage}">
                <i class="bi bi-check-circle-fill me-1"></i> <span th:text="${successMessage}">Account created</span>
            </div>

            <!-- Login Form -->
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-secondary"><i class="bi bi-envelope"></i></span>
                        <input type="email" name="email" class="form-control border-start-0" placeholder="name@example.com" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <label class="form-label small fw-semibold">Password</label>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-secondary"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control border-start-0" placeholder="Enter your password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 py-2">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                </button>
            </form>

            <div class="text-center mt-3">
                <span class="text-secondary small">Don't have an account? </span>
                <a th:href="@{/register}" class="fw-semibold text-primary small text-decoration-none">Create Account</a>
            </div>

            <!-- College Demo Credentials Card -->
            <div class="demo-credentials mt-4">
                <h6><i class="bi bi-key-fill me-1"></i> Demo Credentials (Pre-seeded):</h6>
                <div class="mb-1">
                    <strong>Admin:</strong> <code>admin@phoneverdict.com</code> / <code>admin123</code>
                </div>
                <div>
                    <strong>User:</strong> <code>user@phoneverdict.com</code> / <code>user123</code>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
