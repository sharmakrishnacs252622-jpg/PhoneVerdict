<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
</head>
<body>
<div th:fragment="header">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark-navy sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/}">
                <i class="bi bi-phone-flip text-primary-light fs-4"></i>
                <span>Phone<span class="text-primary-light">Verdict</span></span>
            </a>
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
                    aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}"><i class="bi bi-house-door me-1"></i> Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/phones}"><i class="bi bi-phone me-1"></i> Phones</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/compare}"><i class="bi bi-arrow-left-right me-1"></i> Compare</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/categories}"><i class="bi bi-grid-3x3-gap me-1"></i> Categories</a>
                    </li>
                </ul>

                <!-- Search form in header -->
                <form class="d-flex me-3 my-2 my-lg-0" th:action="@{/search}" method="get">
                    <div class="input-group">
                        <input class="form-control" type="search" name="q" placeholder="Search phone, brand..." aria-label="Search">
                        <button class="btn btn-outline-light border-start-0" type="submit">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                </form>

                <!-- Auth links -->
                <ul class="navbar-nav align-items-lg-center">
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="nav-link" th:href="@{/login}"><i class="bi bi-box-arrow-in-right me-1"></i> Login</a>
                    </li>
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="btn btn-sm btn-primary-custom ms-lg-2" th:href="@{/register}"><i class="bi bi-person-plus me-1"></i> Register</a>
                    </li>

                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="btn btn-sm btn-outline-warning ms-lg-2 me-lg-2 my-1 my-lg-0" th:href="@{/admin}">
                            <i class="bi bi-speedometer2 me-1"></i> Admin Panel
                        </a>
                    </li>

                    <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                        <a class="nav-link dropdown-toggle d-flex align-items-center gap-1" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person-circle fs-5"></i>
                            <span sec:authentication="name" class="d-inline-block text-truncate" style="max-width: 150px;">User</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0" aria-labelledby="userDropdown">
                            <li sec:authorize="hasRole('ADMIN')">
                                <a class="dropdown-item" th:href="@{/admin}"><i class="bi bi-speedometer2 me-2"></i> Admin Dashboard</a>
                            </li>
                            <li sec:authorize="hasRole('ADMIN')"><hr class="dropdown-divider"></li>
                            <li>
                                <form th:action="@{/logout}" method="post" class="m-0 p-0">
                                    <button type="submit" class="dropdown-item text-danger">
                                        <i class="bi bi-box-arrow-right me-2"></i> Logout
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</div>
</body>
</html>
