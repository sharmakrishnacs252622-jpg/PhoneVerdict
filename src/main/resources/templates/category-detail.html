<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${categoryName + ' - PhoneVerdict'}">Category Detail</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom Theme CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

    <!-- Header -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- Page Header -->
    <div class="page-header text-center">
        <div class="container">
            <h1 th:text="${categoryName}">Category Name</h1>
            <p>Smartphones ranked by our specialized category metrics</p>
        </div>
    </div>

    <div class="container mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <a th:href="@{/categories}" class="btn btn-outline-secondary rounded-pill btn-sm">
                <i class="bi bi-arrow-left me-1"></i> All Categories
            </a>
            <span class="text-secondary small" th:text="${phones.size()} + ' devices listed'">6 devices</span>
        </div>

        <div class="row g-4">
            <div class="col-lg-4 col-md-6" th:each="phone : ${phones}">
                <div class="phone-card">
                    <div class="card-img-container position-relative">
                        <span class="badge bg-primary position-absolute top-0 end-0 m-3" th:text="${phone.overallScore} + ' Verdict'">9.2</span>
                        <img th:src="${phone.imageUrl}" th:alt="${phone.model}">
                    </div>
                    <div class="card-body">
                        <span class="brand-badge" th:text="${phone.brand}">Brand</span>
                        <h4 class="phone-name" th:text="${phone.model}">Model Name</h4>
                        <div class="phone-price" th:text="'₹' + ${#numbers.formatDecimal(phone.price, 1, 'COMMA', 0, 'POINT')}">₹69,999</div>

                        <div class="phone-specs mt-2 mb-3">
                            <span><i class="bi bi-cpu"></i> <span th:text="${phone.processor}">Processor</span></span><br>
                            <span><i class="bi bi-camera"></i> <span th:text="${phone.mainCamera}">50 MP</span></span><br>
                            <span><i class="bi bi-battery-charging"></i> <span th:text="${phone.battery}">5000 mAh</span></span>
                        </div>

                        <div class="card-actions">
                            <a th:href="@{/phones/{id}(id=${phone.id})}" class="btn btn-primary-custom">View Details</a>
                            <button type="button" class="btn btn-outline-secondary"
                                    th:onclick="addToCompare([[${phone.id}]], [[${phone.model}]], [[${phone.brand}]], [[${phone.imageUrl}]])">
                                <i class="bi bi-plus-lg"></i> Compare
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
