<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - PhoneVerdict</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom Theme CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Header -->
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="text-center mb-3">
                <i class="bi bi-person-plus-fill text-primary fs-1"></i>
            </div>
            <h2>Create an Account</h2>
            <p class="auth-subtitle">Join PhoneVerdict to share authentic smartphone reviews</p>

            <!-- Error alert -->
            <div class="alert alert-danger py-2 small mb-3" th:if="${registrationError}">
                <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${registrationError}">Error message</span>
            </div>

            <!-- Registration Form -->
            <form th:action="@{/register}" th:object="${userDTO}" method="post">
                <!-- Full Name -->
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-secondary"><i class="bi bi-person"></i></span>
                        <input type="text" th:field="*{name}" class="form-control border-start-0" placeholder="Rahul Sharma" required>
                    </div>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-secondary"><i class="bi bi-envelope"></i></span>
                        <input type="email" th:field="*{email}" class="form-control border-start-0" placeholder="name@example.com" required>
                    </div>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Password (min 6 characters)</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-secondary"><i class="bi bi-lock"></i></span>
                        <input type="password" th:field="*{password}" class="form-control border-start-0" placeholder="Create strong password" required>
                    </div>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <!-- Confirm Password -->
                <div class="mb-4">
                    <label class="form-label small fw-semibold">Confirm Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-secondary"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" th:field="*{confirmPassword}" class="form-control border-start-0" placeholder="Re-enter password" required>
                    </div>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 py-2">
                    <i class="bi bi-check2-circle me-1"></i> Register
                </button>
            </form>

            <div class="text-center mt-3">
                <span class="text-secondary small">Already have an account? </span>
                <a th:href="@{/login}" class="fw-semibold text-primary small text-decoration-none">Sign In</a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
