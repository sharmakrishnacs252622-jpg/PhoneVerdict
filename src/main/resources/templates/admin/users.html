<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registered Users - Admin Panel</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom Theme CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Header -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- Admin Header -->
    <div class="admin-header">
        <div class="container d-flex justify-content-between align-items-center">
            <div>
                <span class="badge bg-warning text-dark px-3 py-1 rounded-pill mb-2 fw-semibold">Administration Console</span>
                <h1 class="mb-0 text-white">Registered Users</h1>
            </div>
            <a th:href="@{/admin}" class="btn btn-outline-light rounded-pill px-3">
                <i class="bi bi-speedometer2 me-1"></i> Dashboard
            </a>
        </div>
    </div>

    <!-- Admin Sub-Navigation -->
    <div class="bg-white border-bottom shadow-sm mb-4">
        <div class="container">
            <ul class="nav nav-pills py-2 gap-2">
                <li class="nav-item">
                    <a class="nav-link text-dark" th:href="@{/admin}"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-dark" th:href="@{/admin/phones}"><i class="bi bi-phone me-1"></i> Manage Phones</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-dark" th:href="@{/admin/reviews}"><i class="bi bi-chat-quote me-1"></i> Reviews</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active bg-primary" th:href="@{/admin/users}"><i class="bi bi-people me-1"></i> Registered Users</a>
                </li>
            </ul>
        </div>
    </div>

    <div class="container mb-5">
        <div class="admin-table">
            <div class="p-3 bg-white border-bottom d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-bold">All Accounts (<span th:text="${users.size()}">4</span> registered)</h5>
            </div>
            <div class="table-responsive">
                <table class="table mb-0 align-middle">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Full Name</th>
                            <th>Email Address</th>
                            <th>Security Role</th>
                            <th>Registration Date</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u, stat : ${users}">
                            <td class="text-secondary small" th:text="${stat.count}">1</td>
                            <td class="fw-bold">
                                <i class="bi bi-person-circle text-primary me-2"></i>
                                <span th:text="${u.name}">Rahul Sharma</span>
                            </td>
                            <td class="text-secondary" th:text="${u.email}">user@phoneverdict.com</td>
                            <td>
                                <span th:if="${u.role.name() == 'ADMIN'}" class="badge-admin">ADMINISTRATOR</span>
                                <span th:if="${u.role.name() == 'USER'}" class="badge-user">USER</span>
                            </td>
                            <td class="small text-secondary" th:text="${#temporals.format(u.createdAt, 'dd MMM yyyy, HH:mm')}">08 Oct 2025, 10:00</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
