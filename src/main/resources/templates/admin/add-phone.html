<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Smartphone - Admin Panel</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom Theme CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Header -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- Admin Header -->
    <div class="admin-header">
        <div class="container d-flex justify-content-between align-items-center">
            <div>
                <span class="badge bg-warning text-dark px-3 py-1 rounded-pill mb-2 fw-semibold">Administration Console</span>
                <h1 class="mb-0 text-white">Add New Smartphone</h1>
            </div>
            <a th:href="@{/admin/phones}" class="btn btn-outline-light rounded-pill px-3">
                <i class="bi bi-arrow-left me-1"></i> Back to Phone List
            </a>
        </div>
    </div>

    <div class="container my-5">
        <div class="admin-form">
            <form th:action="@{/admin/phones/add}" th:object="${phone}" method="post">
                <!-- 1. Basic Info -->
                <div class="form-section">
                    <h5><i class="bi bi-info-circle-fill"></i> 1. Basic Information</h5>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label small fw-bold">Brand *</label>
                            <input type="text" class="form-control" th:field="*{brand}" placeholder="e.g. Samsung, Apple, OnePlus" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-bold">Model Name *</label>
                            <input type="text" class="form-control" th:field="*{model}" placeholder="e.g. Galaxy S25 Ultra" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-bold">Price (in INR) *</label>
                            <input type="number" step="1" class="form-control" th:field="*{price}" placeholder="e.g. 79999" required>
                        </div>
                        <div class="col-md-8">
                            <label class="form-label small fw-bold">Image URL</label>
                            <input type="url" class="form-control" th:field="*{imageUrl}" placeholder="https://example.com/phone.jpg">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-bold">Release Date</label>
                            <input type="date" class="form-control" th:field="*{releaseDate}">
                        </div>
                    </div>
                </div>

                <!-- 2. Display -->
                <div class="form-section">
                    <h5><i class="bi bi-aspect-ratio-fill"></i> 2. Display Specifications</h5>
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label small fw-bold">Screen Size</label>
                            <input type="text" class="form-control" th:field="*{displaySize}" placeholder="e.g. 6.82 inches">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-bold">Resolution</label>
                            <input type="text" class="form-control" th:field="*{resolution}" placeholder="e.g. 3120 x 1440">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-bold">Refresh Rate</label>
                            <input type="text" class="form-control" th:field="*{refreshRate}" placeholder="e.g. 120Hz">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-bold">Panel Type</label>
                            <input type="text" class="form-control" th:field="*{panelType}" placeholder="e.g. Dynamic AMOLED 2X">
                        </div>
                    </div>
                </div>

                <!-- 3. Performance -->
                <div class="form-section">
                    <h5><i class="bi bi-cpu-fill"></i> 3. Performance &amp; Hardware</h5>
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label small fw-bold">Processor (SoC)</label>
                            <input type="text" class="form-control" th:field="*{processor}" placeholder="e.g. Snapdragon 8 Elite">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-bold">GPU</label>
                            <input type="text" class="form-control" th:field="*{gpu}" placeholder="e.g. Adreno 830">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-bold">RAM</label>
                            <input type="text" class="form-control" th:field="*{ram}" placeholder="e.g. 12 GB">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-bold">Storage</label>
                            <input type="text" class="form-control" th:field="*{storage}" placeholder="e.g. 256 GB">
                        </div>
                    </div>
                </div>

                <!-- 4. Cameras -->
                <div class="form-section">
                    <h5><i class="bi bi-camera-fill"></i> 4. Camera System</h5>
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label small fw-bold">Main Camera</label>
                            <input type="text" class="form-control" th:field="*{mainCamera}" placeholder="e.g. 200 MP OIS">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-bold">Ultra-wide Camera</label>
                            <input type="text" class="form-control" th:field="*{ultrawideCamera}" placeholder="e.g. 50 MP">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-bold">Telephoto Camera</label>
                            <input type="text" class="form-control" th:field="*{telephotoCamera}" placeholder="e.g. 50 MP 5x Optical">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-bold">Front Camera</label>
                            <input type="text" class="form-control" th:field="*{frontCamera}" placeholder="e.g. 12 MP TrueDepth">
                        </div>
                    </div>
                </div>

                <!-- 5. Battery & Software -->
                <div class="form-section">
                    <h5><i class="bi bi-battery-charging"></i> 5. Battery &amp; Software</h5>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label small fw-bold">Battery Capacity</label>
                            <input type="text" class="form-control" th:field="*{battery}" placeholder="e.g. 5000 mAh">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-bold">Charging Speed</label>
                            <input type="text" class="form-control" th:field="*{chargingSpeed}" placeholder="e.g. 45W Wired, 15W Wireless">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-bold">Operating System</label>
                            <input type="text" class="form-control" th:field="*{os}" placeholder="e.g. Android 15 (One UI 7)">
                        </div>
                    </div>
                </div>

                <!-- 6. Connectivity & Design -->
                <div class="form-section">
                    <h5><i class="bi bi-wifi"></i> 6. Connectivity &amp; Build</h5>
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label small fw-bold">Wi-Fi</label>
                            <input type="text" class="form-control" th:field="*{wifi}" placeholder="e.g. Wi-Fi 7">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-bold">Bluetooth</label>
                            <input type="text" class="form-control" th:field="*{bluetooth}" placeholder="e.g. 5.4">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-bold">Water Resistance</label>
                            <input type="text" class="form-control" th:field="*{waterResistance}" placeholder="e.g. IP68">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-bold">Weight</label>
                            <input type="text" class="form-control" th:field="*{weight}" placeholder="e.g. 218g">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Colors (comma separated)</label>
                            <input type="text" class="form-control" th:field="*{colors}" placeholder="Titanium Black, Titanium Gray, White">
                        </div>
                        <div class="col-md-3 d-flex align-items-center mt-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" th:field="*{fiveG}" id="check5G">
                                <label class="form-check-label small fw-bold" for="check5G">5G Supported</label>
                            </div>
                        </div>
                        <div class="col-md-3 d-flex align-items-center mt-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" th:field="*{nfc}" id="checkNFC">
                                <label class="form-check-label small fw-bold" for="checkNFC">NFC Supported</label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 7. Pros & Cons -->
                <div class="form-section">
                    <h5><i class="bi bi-check2-all"></i> 7. Pros and Cons</h5>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Pros (separate with semicolon ;)</label>
                            <textarea class="form-control" rows="3" th:field="*{pros}" placeholder="Exceptional battery;Superb zoom camera;Bright screen"></textarea>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Cons (separate with semicolon ;)</label>
                            <textarea class="form-control" rows="3" th:field="*{cons}" placeholder="Expensive;No charger in box;Heavyweight"></textarea>
                        </div>
                    </div>
                </div>

                <!-- 8. Verdict Engine Benchmark Scores -->
                <div class="form-section">
                    <h5><i class="bi bi-speedometer2"></i> 8. Verdict Engine Scores (0.0 to 10.0)</h5>
                    <div class="row g-3">
                        <div class="col-md-2 col-6">
                            <label class="form-label small fw-bold">Performance</label>
                            <input type="number" step="0.1" min="0" max="10" class="form-control" th:field="*{performanceScore}" required>
                        </div>
                        <div class="col-md-2 col-6">
                            <label class="form-label small fw-bold">Camera</label>
                            <input type="number" step="0.1" min="0" max="10" class="form-control" th:field="*{cameraScore}" required>
                        </div>
                        <div class="col-md-2 col-6">
                            <label class="form-label small fw-bold">Battery</label>
                            <input type="number" step="0.1" min="0" max="10" class="form-control" th:field="*{batteryScore}" required>
                        </div>
                        <div class="col-md-2 col-6">
                            <label class="form-label small fw-bold">Display</label>
                            <input type="number" step="0.1" min="0" max="10" class="form-control" th:field="*{displayScore}" required>
                        </div>
                        <div class="col-md-2 col-6">
                            <label class="form-label small fw-bold">Value</label>
                            <input type="number" step="0.1" min="0" max="10" class="form-control" th:field="*{valueScore}" required>
                        </div>
                    </div>
                </div>

                <div class="p-4 bg-white text-end border-top rounded-bottom-4">
                    <a th:href="@{/admin/phones}" class="btn btn-outline-secondary me-2 rounded-pill px-4">Cancel</a>
                    <button type="submit" class="btn btn-primary-custom px-5">
                        <i class="bi bi-save me-1"></i> Save Smartphone
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
